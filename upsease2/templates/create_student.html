<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Student</title>
<style>
    :root {
        --bc-red: #E4032E;
        --bc-red-dark: #B4001F;
        --bc-dark: #1a1a1a;
        --bc-light: #fff5f5;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bc-light);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }
    .card {
        background: #ffffff;
        width: 420px;
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        overflow: hidden;
    }
    .card-header {
        background: var(--bc-red);
        color: #ffffff;
        padding: 20px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
    }
    .card-body {
        padding: 24px;
    }
    label {
        display: block;
        margin-bottom: 6px;
        color: var(--bc-dark);
        font-size: 14px;
        font-weight: bold;
    }
    input[type="text"], input[type="email"], input[type="password"], input[type="number"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
    }
    button {
        width: 100%;
        padding: 12px;
        background: var(--bc-red);
        color: #ffffff;
        border: none;
        border-radius: 4px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }
    button:hover { background: var(--bc-red-dark); }
    .back-link {
        display: block;
        text-align: center;
        margin-top: 14px;
        color: var(--bc-red);
        text-decoration: none;
        font-size: 13px;
    }
    .flash {
        background: #ffe1e1;
        color: var(--bc-red-dark);
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 16px;
        font-size: 13px;
        text-align: center;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="card-header">Create Student Account</div>
        <div class="card-body">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="flash">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="POST" action="{{ url_for('admin_create_student') }}">
                <label for="firstname">First Name</label>
                <input type="text" id="firstname" name="firstname" required>

                <label for="middlename">Middle Name</label>
                <input type="text" id="middlename" name="middlename">

                <label for="lastname">Last Name</label>
                <input type="text" id="lastname" name="lastname" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="months">Months</label>
                <input type="number" id="months" name="months" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Create Student</button>
            </form>
            <a class="back-link" href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
