<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPSEAS/dashboard</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

body {
background-color: #faf7f7;
color: #2d2626;
min-height: 100vh;
display: flex;
flex-direction: column;
        }

/* Navbar */
.navbar {
background-color: #ffffff;
border-bottom: 1px solid #f0e6e6;
padding: 16px 32px;
display: flex;
justify-content: space-between;
align-items: center;
        }

.nav-brand {
display: flex;
align-items: center;
gap: 12px;
font-weight: 600;
color: #e90505;
font-size: 1.1rem;
        }

.user-profile {
font-size: 0.9rem;
color: #7a6e6e;
        }

.nav-right {
display: flex;
align-items: center;
gap: 20px;
        }

.tasks-shortcut {
display: inline-flex;
align-items: center;
gap: 6px;
background-color: #fcf0f0;
color: #e90505;
border: 1px solid #f8d7d7;
padding: 8px 14px;
border-radius: 20px;
font-size: 0.85rem;
font-weight: 600;
text-decoration: none;
transition: background-color 0.2s ease;
        }

.tasks-shortcut:hover {
background-color: #f8d7d7;
        }

/* Container */
.container {
max-width: 600px;
margin: 48px auto;
padding: 0 24px;
width: 100%;
        }

/* Welcome Message */
.welcome-section {
margin-bottom: 32px;
        }

.welcome-section h1 {
font-size: 1.8rem;
font-weight: 500;
color: #1f1414;
        }

.welcome-section p {
font-size: 0.9rem;
color: #7a6e6e;
margin-top: 6px;
        }

/* Vertical List Layout */
.skills-list {
display: flex;
flex-direction: column;
        }

.skill-row {
display: flex;
align-items: center;
justify-content: space-between;
padding: 18px 4px;
border-bottom: 1px solid #f0e6e6;
transition: padding-left 0.15s ease;
        }

.skill-row:hover {
padding-left: 8px;
        }

.skill-row:last-child {
border-bottom: none;
        }

.skill-info {
display: flex;
align-items: center;
gap: 14px;
        }

.skill-icon {
font-size: 1.2rem;
        }

.skill-title {
font-size: 1.1rem;
font-weight: 500;
color: #1f1414;
        }

.skill-btn {
display: inline-block;
background-color: #e90505;
color: #ffffff;
min-width: 100px;
padding: 10px 20px;
border-radius: 6px;
text-decoration: none;
font-size: 0.85rem;
font-weight: 500;
transition: opacity 0.2s ease;
text-align: center;
        }

.skill-btn:hover {
opacity: 0.85;
        }
</style>
</head>
<body>

<!-- Header Navigation -->
<nav class="navbar">
<div class="nav-brand">

<span>UPSEAS CONSULTANCY</span>
</div>
<div class="nav-right">
<a href="#" class="tasks-shortcut">📋 Tasks</a>
<div class="user-profile"><b>{{ firstname }}</b></div>
</div>
</nav>


<!-- Main Workspace -->
<main class="container">
<!-- Welcome Section -->
<section class="welcome-section">
<h1>Welcome {{ firstname}}</h1>
<p>Pick a module.</p>
</section>

<!-- Vertical Skills List -->
<div class="skills-list">
<div class="skill-row">
<div class="skill-info">

<span class="skill-title">Listening</span>
</div>
<a href="{{ url_for('listening_module') }}" class="skill-btn">Start</a>
</div>

<div class="skill-row">
<div class="skill-info">

<span class="skill-title">Reading</span>
</div>
<a href="{{ url_for('reading_module') }}" class="skill-btn">Start</a>
</div>

<div class="skill-row">
<div class="skill-info">

<span class="skill-title">Writing</span>
</div>
<a href="{{ url_for('writing_module') }}" class="skill-btn">Start</a>
</div>

<div class="skill-row">
<div class="skill-info">

<span class="skill-title">Speaking</span>
</div>
<a href="{{ url_for('speaking_module') }}" class="skill-btn">Start</a>
</div>


</div>

</main>

</body>
</html>
