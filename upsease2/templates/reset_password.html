<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>
<style>
    :root {
        --bc-red: #E4032E;
        --bc-red-dark: #B4001F;
        --bc-dark: #1a1a1a;
        --bc-light: #fff5f5;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bc-light);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .card {
        background: #ffffff;
        width: 360px;
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        overflow: hidden;
    }
    .card-header {
        background: var(--bc-red);
        color: #ffffff;
        padding: 20px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
    }
    .card-body {
        padding: 24px;
    }
    label {
        display: block;
        margin-bottom: 6px;
        color: var(--bc-dark);
        font-size: 14px;
        font-weight: bold;
    }
    input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
    }
    button {
        width: 100%;
        padding: 12px;
        background: var(--bc-red);
        color: #ffffff;
        border: none;
        border-radius: 4px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }
    button:hover { background: var(--bc-red-dark); }
    .flash {
        background: #ffe1e1;
        color: var(--bc-red-dark);
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 16px;
        font-size: 13px;
        text-align: center;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="card-header">Reset Password</div>
        <div class="card-body">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="flash">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="POST" action="{{ url_for('reset_password', token=token) }}">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Update Password</button>
            </form>
        </div>
    </div>
</body>
</html>
